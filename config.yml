backend:
  name: git-gateway
  branch: main
media_folder: uploads
public_folder: /uploads

collections:
  - name: site
    label: Site content
    files:
      - label: Home page
        name: home
        file: home.json
        fields:
          - { label: Intro text, name: intro, widget: text }
          - { label: Discord invite link, name: discord_invite, widget: string, required: false }
          - label: Highlights
            name: highlights
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
      - label: Minecraft server
        name: minecraft
        file: plan.json
        fields:
          - { label: Page title, name: title, widget: string }
          - { label: Description, name: description, widget: text, required: false }
          - { label: Shulker server name, name: shulker_server_name, widget: string, required: false, hint: "Exact name in your Shulker dashboard. Enables live status." }
          - { label: Shulker node, name: shulker_node, widget: string, required: false, hint: "Node code, e.g. de0 or us1." }
